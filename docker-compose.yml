services:
  mysql:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: agent_platform, MYSQL_USER: agent, MYSQL_PASSWORD: agent, MYSQL_ROOT_PASSWORD: root}
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    profiles: [app]
    build: ./backend
  frontend:
    profiles: [app]
    build: ./frontend
volumes: {mysql_data: {}}
