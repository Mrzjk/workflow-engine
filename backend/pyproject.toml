[project]
name = "agent-platform-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.10", "pydantic-settings>=2.6",
  "sqlalchemy>=2.0", "alembic>=1.14", "aiomysql>=0.2", "redis>=5.2", "langchain>=1.0,<2",
  "langchain-core>=1.0,<2", "langchain-openai>=1.0", "langchain-ollama>=1.0", "langgraph>=1.0,<2",
  "python-dotenv>=1.0", "sse-starlette>=2.2", "structlog>=24.4", "jinja2>=3.1", "pyjwt>=2.10", "pwdlib[argon2]>=0.2"
]
[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.8", "mypy>=1.13"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 100
